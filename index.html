<title>Tic Tac Toe</title>
<meta charset="UTF-8" />

<style>
  body,
  td,
  input {
    font-size: 24px;
    line-height: 1.5;
    text-align: center;
    font-family: system-ui, sans-serif;
  }
  td {
    height: 3rem;
    width: 3rem;
    text-align: center;
    cursor: pointer;
  }
  table {
    margin: 2rem auto;
  }
  #scoreboard {
    margin-top: 1rem;
    font-size: 20px;
    font-weight: bold;
  }
  button {
    margin-top: 1rem;
    padding: 0.5rem 1rem;
    font-size: 18px;
    cursor: pointer;
  }
  @media (prefers-color-scheme: dark) {
    body,
    input {
      background: #222;
      color: #ccc;
    }
  }
</style>

<h1>Tic Tac Toe</h1>
<div id="scoreboard">🧑‍💻 0 - 0 🤖</div>

<table>
  <tr>
    <td><input type="checkbox" /></td>
    <td><input type="checkbox" /></td>
    <td><input type="checkbox" /></td>
  </tr>
  <tr>
    <td><input type="checkbox" /></td>
    <td><input type="checkbox" /></td>
    <td><input type="checkbox" /></td>
  </tr>
  <tr>
    <td><input type="checkbox" /></td>
    <td><input type="checkbox" /></td>
    <td><input type="checkbox" /></td>
  </tr>
</table>

<h2 hidden id="gameStatus">Game over!</h2>
<button hidden id="restartBtn">Play Again</button>

<script>
  // Initialization
  let humanScore = 0;
  let robotScore = 0;

  const boxes = Array.from(document.querySelectorAll("td"));
  const inputs = Array.from(document.querySelectorAll("[type=checkbox]"));
  const rows = [1, 2, 3].map((n) =>
    Array.from(document.querySelectorAll(`tr:nth-child(${n}) td`))
  );
  const columns = [1, 2, 3].map((n) =>
    Array.from(document.querySelectorAll(`td:nth-child(${n})`))
  );
  const diagonals = [
    [
      [1, 1],
      [2, 2],
      [3, 3],
    ],
    [
      [3, 1],
      [2, 2],
      [1, 3],
    ],
  ].map((set) =>
    set.map(([x, y]) =>
      document.querySelector(`tr:nth-child(${x}) td:nth-child(${y})`)
    )
  );

  const gameStatus = document.querySelector("#gameStatus");
  const restartBtn = document.querySelector("#restartBtn");
  const scoreboard = document.querySelector("#scoreboard");

  const HUMAN = "🧑‍💻";
  const ROBOT = "🤖";

  // Decide who goes first
  if (Math.random() > 0.5) {
    runRobotTurn();
  }

  // Handle when a user clicks an input
  for (const input of inputs) {
    input.addEventListener("click", handleClickInput);
  }

  function handleClickInput(evt) {
    evt.target.closest("td").innerHTML = HUMAN;
    if (hasWin()) {
      humanScore++;
      return endGame(`${HUMAN} wins!`);
    }
    if (isDraw()) {
      return endGame("It's a Draw!");
    }
    runRobotTurn();
    if (hasWin()) {
      robotScore++;
      return endGame(`${ROBOT} wins!`);
    }
    if (isDraw()) {
      return endGame("It's a Draw!");
    }
  }

  // Choose a random available box
  function runRobotTurn() {
    const robotBoxes = shuffle(boxes);
    while (robotBoxes.length) {
      const box = robotBoxes.shift();
      if (box.querySelector("input")) {
        box.innerHTML = ROBOT;
        break;
      }
    }
  }

  // Determine win
  function hasWin() {
    return (
      rows.some(hasAllSame) ||
      columns.some(hasAllSame) ||
      diagonals.some(hasAllSame)
    );
  }

  function hasAllSame(arr) {
    return arr.every(
      (td) => !td.querySelector("input") && td.innerHTML === arr[0].innerHTML
    );
  }

  // Check for draw
  function isDraw() {
    return boxes.every((td) => !td.querySelector("input")) && !hasWin();
  }

  // End game
  function endGame(message) {
    gameStatus.hidden = false;
    gameStatus.textContent = message;
    restartBtn.hidden = false;
    updateScore();

    for (const input of inputs) {
      input.removeEventListener("click", handleClickInput);
      input.remove();
    }
  }

  // Restart game
  restartBtn.addEventListener("click", () => {
    boxes.forEach((td) => {
      td.innerHTML = '<input type="checkbox" />';
    });
    gameStatus.hidden = true;
    restartBtn.hidden = true;
    resetInputs();

    if (Math.random() > 0.5) {
      runRobotTurn();
    }
  });

  // Reattach input listeners
  function resetInputs() {
    const inputs = Array.from(document.querySelectorAll("[type=checkbox]"));
    for (const input of inputs) {
      input.addEventListener("click", handleClickInput);
    }
  }

  // Update scoreboard
  function updateScore() {
    scoreboard.textContent = `${HUMAN} ${humanScore} - ${robotScore} ${ROBOT}`;
  }

  // Shuffle
  function shuffle(array) {
    array = array.slice(0);
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * i);
      const temp = array[i];
      array[i] = array[j];
      array[j] = temp;
    }
    return array;
  }
</script>
